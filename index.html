<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DV Experiments</title>
  <meta name="description" content="Simulations, data visualisations and creative software experiments by DV Experiments.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EDF1F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1526" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="DV Experiments">
  <meta property="og:description" content="Simulations, data visualisations and creative software experiments.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Saira:wdth,wght@75..125,300..700&display=swap">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="All projects">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".45"/>
          <circle cx="16" cy="16" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="16" cy="16" r="2.6" fill="var(--accent)"/>
          <circle cx="26.2" cy="9.4" r="2.4" fill="var(--live)"/>
        </svg>
        <span class="brand__name" data-site-title>DV Experiments</span>
      </a>
      <nav class="topnav" aria-label="Site">
        <a href="#/" data-nav="projects">Projects</a>
        <a href="https://github.com/DVExperiments" data-profile-link target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" type="button" aria-label="Theme: match system">
          <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="system"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="light"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="dark"><path d="M20 14.6A8.4 8.4 0 0 1 9.4 4a8.4 8.4 0 1 0 10.6 10.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span class="theme-toggle__label">Auto</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="boot" aria-live="polite">Loading projects…</div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p data-sync-note>Synced with GitHub.</p>
      <p><a href="https://github.com/DVExperiments" data-profile-link target="_blank" rel="noopener">All repositories on GitHub</a></p>
    </div>
  </footer>

  <div class="orbit-tip" role="presentation" hidden></div>
  <script src="assets/app.js" defer></script>
</body>
</html>
